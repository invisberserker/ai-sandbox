# =============================================================================
# DeepSeek Harness (dsh) override — merged by the Justfile for `-dsh`
# projects after compose.sandbox.yaml (and compose.ports.yaml when
# SANDBOX_PORTS=1).
# =============================================================================
# The dsh image runs the web UI as its session process (image CMD), but the
# base compose file publishes no ports. This override:
#   - publishes the DSH UI on VM loopback at ${DSH_PORT} (lima forwards it
#     to macOS 127.0.0.1:${DSH_PORT});
#   - REPLACES any opencode window from compose.ports.yaml with a UI-only
#     `ports: !override` list (compose >= 2.24), so a dsh sandbox never
#     inherits the opencode port range;
#   - persists DSH state/config in the per-flavor dsh-home volume.
#
# The dsh dev-server window is opt-in: compose.dsh.ports.yaml is merged
# after this file only when SANDBOX_PORTS=1.
#
# Each concurrently running DSH project needs its own DSH_PORT. The first
# boot prints a /deepseek?token=… link; `just logs <p>-dsh` shows it.
# =============================================================================
services:
  agent:
    environment:
      # Used by /usr/local/bin/dsh-web for --public-url/--trusted-host.
      # DSH_PORT / DSH_TRUSTED_HOSTS arrive from .sandbox.env via ${VAR}
      # interpolation — the one place knob values enter the container.
      - DSH_PORT=${DSH_PORT:-3080}
      - DSH_CONTAINER_PORT=3080
      # Optional space-separated extra authorities (host or host:port).
      # localhost:${DSH_PORT} and 127.0.0.1:${DSH_PORT} are trusted already.
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
    # UI only. compose.dsh.ports.yaml (opt-in) replaces this list with the
    # UI plus the dsh dev window.
    ports: !override
      - "127.0.0.1:${DSH_PORT:-3080}:3080"
    volumes:
      # DSH state, sessions and the baked web profile. Docker seeds a fresh
      # volume from image content (/root/.dsh) on first mount; later edits
      # persist. Re-seed by removing the flavor's dsh-home volume.
      - type: volume
        source: dsh-home
        target: /root/.dsh

volumes:
  dsh-home:

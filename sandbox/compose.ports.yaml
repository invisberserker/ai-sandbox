# =============================================================================
# Per-project dev-server window — opt-in, merged only with SANDBOX_PORTS=1
# =============================================================================
# The Justfile includes this file only when the project's .sandbox.env sets
# SANDBOX_PORTS=1 (default off). It applies to `just up`; the Justfile's
# `shell` path deliberately publishes no ports.
#
# IDENTITY mapping: sandbox port N appears on macOS localhost:N for every N
# in the window (published on the VM's 127.0.0.1; lima forwards VM ports to
# the Mac as-is). Set the window to cover YOUR app's ports, e.g. a vite app
# on :5173 → PORT_BASE=5173 PORT_BASE_END=5199.
#
# Collisions behave like host docker: a second sandbox claiming an
# overlapping window fails loudly at `up` ("port already allocated") —
# re-window one project or expose single ports ad hoc instead:
#   just expose <name> 3000
#
# Scope notes:
#   - dev servers must bind 0.0.0.0 INSIDE the sandbox (`vite --host`) —
#     the publish DNATs to the sandbox's bridge IP, so loopback-only
#     listeners are invisible;
#   - INNER-daemon `-p` publishes ride the same window via the same
#     VM-side publish (that's the range's point: postgres et al.);
#   - ports in the window with no listener just refuse connections.
#
# A -dsh sandbox never inherits this window: compose.dsh.yaml replaces it
# with the DSH UI, and compose.dsh.ports.yaml (same opt-in) adds the dsh
# range instead.
# =============================================================================
services:
  agent:
    ports:
      - "127.0.0.1:${PORT_BASE:-3000}-${PORT_BASE_END:-3199}:${PORT_BASE:-3000}-${PORT_BASE_END:-3199}"
